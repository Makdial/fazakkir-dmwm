{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} - Fazakkir{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>{% trans "Your password has been changed" %}</h1>
    </div>

    <p>{% trans "You can now sign in with your new password." %}</p>

    <p class="auth-footer">
        <a href="{% url 'accounts:login' %}">{% trans "Sign In" %}</a>
    </p>
</div>
{% endblock %}
